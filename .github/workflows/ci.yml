# Offline tests only. No AWS credentials, no secrets, no deployment.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: ap-south-1   # boto3 needs a region at import; no credentials are configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # same as the Lambda runtime
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Secret scan
        run: python tests/secret_scan.py
      - name: Python unit tests (all Lambdas except inference, which needs tflite_runtime)
        run: |
          python -m pip install --quiet boto3
          python tests/run_all.py
      - name: Dashboard tests
        run: |
          node --check dashboard/app.js
          node tests/dashboard.test.js
          node tests/dashboard.smoke.test.js
